<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For Nich</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap">
  
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at center, #1a0624 0%, #030107 100%);
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      font-family: 'Poppins', sans-serif;
    }

    #click-prompt {
      color: #ff7597;
      font-size: 1rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      border: 1px solid rgba(255, 117, 151, 0.4);
      padding: 12px 24px;
      border-radius: 50px;
      background: rgba(6, 2, 11, 0.85);
      box-shadow: 0 0 30px rgba(238, 82, 130, 0.3);
      cursor: pointer;
      pointer-events: auto;
      transition: all 0.5s ease-in-out;
      animation: pulseButton 2s infinite;
      position: absolute;
      white-space: nowrap;
    }

    #click-prompt.at-bottom {
      bottom: 8%;
    }

    svg {
      display: none;
    }

    @keyframes pulseButton {
      0% { transform: scale(1); box-shadow: 0 0 20px rgba(238, 82, 130, 0.3); }
      50% { transform: scale(1.03); box-shadow: 0 0 40px rgba(238, 82, 130, 0.6); border-color: rgba(255, 117, 151, 0.8); }
      100% { transform: scale(1); box-shadow: 0 0 20px rgba(238, 82, 130, 0.3); }
    }
  </style>
</head>
<body>

<div id="ui-layer">
  <div id="click-prompt">Click to manifest</div>
</div>

<svg viewBox="0 0 600 552">
  <path d="M300,107.77C284.68,55.67,239.76,0,162.31,0,64.83,0,0,82.08,0,171.71c0,.48,0,.95,0,1.43-.52,19.5,0,217.94,299.87,379.69v0l0,0,.05,0,0,0,0,0v0C600,391.08,600.48,192.64,600,173.14c0-.48,0-.95,0-1.43C600,82.08,535.17,0,437.69,0,360.24,0,315.32,55.67,300,107.77" fill="#ee5282"/>
</svg>

<script src="https://cdn.jsdelivr.net/npm/three@0.136.0/build/three.min.js"></script>
<script src="https://unpkg.co/gsap@3/dist/gsap.min.js"></script>

<script>
  console.clear();

  /* SCENE SETUP */
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 5000);
  
  function adjustCameraDistance() {
    if (window.innerWidth < 600) {
      camera.position.z = 850;
    } else if (window.innerWidth < 1024) {
      camera.position.z = 700;
    } else {
      camera.position.z = 600;
    }
  }
  adjustCameraDistance();

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  /* INTERACTIVE TOUCH/MOUSE TRACKING */
  const mouse = new THREE.Vector2(-9999, -9999);
  window.addEventListener('mousemove', (e) => {
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  });
  window.addEventListener('touchmove', (e) => {
    if(e.touches.length > 0) {
      mouse.x = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
    }
  }, { passive: true });

  /* BACKGROUND STARS */
  function createGlowStarTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 64;
    canvas.height = 64;
    const ctx = canvas.getContext('2d');
    const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
    gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
    gradient.addColorStop(0.3, 'rgba(255, 150, 180, 0.6)');
    gradient.addColorStop(0.7, 'rgba(100, 20, 80, 0.1)');
    gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(canvas);
  }
  const starTexture = createGlowStarTexture();

  const bgStarCount = window.innerWidth < 600 ? 100 : 200;
  const bgStarVertices = [];
  for (let i = 0; i < bgStarCount; i++) {
    bgStarVertices.push(new THREE.Vector3(
      (Math.random() - 0.5) * 1600,
      (Math.random() - 0.5) * 1200,
      (Math.random() - 0.5) * 600 - 400
    ));
  }
  const bgStarGeometry = new THREE.BufferGeometry().setFromPoints(bgStarVertices);
  const bgStarMaterial = new THREE.PointsMaterial({
    size: window.innerWidth < 600 ? 16 : 12,
    map: starTexture,
    blending: THREE.AdditiveBlending,
    transparent: true,
    opacity: 0.4,
    depthWrite: false
  });
  const bgStarParticles = new THREE.Points(bgStarGeometry, bgStarMaterial);
  scene.add(bgStarParticles);

  /* UPSCALED TEXT COORDINATES CALCULATOR */
  function getTextCoordinates(text, count, fontSize = 240) {
    const canvas2d = document.createElement('canvas');
    const ctx2d = canvas2d.getContext('2d');
    
    canvas2d.width = 2400;
    canvas2d.height = 800;
    
    ctx2d.font = `bold ${fontSize}px sans-serif`;
    ctx2d.fillStyle = "#ffffff";
    ctx2d.textAlign = "center";
    ctx2d.textBaseline = "middle";
    ctx2d.fillText(text, 1200, 400);

    const imgData = ctx2d.getImageData(0, 0, 2400, 800).data;
    const points = [];
    
    for (let y = 0; y < 800; y += 3) {
      for (let x = 0; x < 2400; x += 3) {
        const alpha = imgData[(y * 2400 + x) * 4 + 3];
        if (alpha > 128) {
          let responsiveScale = window.innerWidth < 600 ? 0.55 : 0.95;
          if (text.length > 5) responsiveScale *= 0.75;
          
          points.push(new THREE.Vector3((x - 1200) * responsiveScale, -(y - 400) * responsiveScale, 0));
        }
      }
    }

    const finalPoints = [];
    for (let i = 0; i < count; i++) {
      const targetPoint = points[i % points.length];
      finalPoints.push(new THREE.Vector3(
        targetPoint.x + (Math.random() - 0.5) * 6,
        targetPoint.y + (Math.random() - 0.5) * 6,
        (Math.random() - 0.5) * 20
      ));
    }
    return finalPoints;
  }

  /* TRACE HEART PATH */
  const path = document.querySelector("path");
  const length = path.getTotalLength();
  
  const particlesData = [];
  const vertices = [];
  const heartTargets = [];
  const stepResolution = window.innerWidth < 600 ? 0.12 : 0.08;

  for (let i = 0; i < length; i += stepResolution) {
    const point = path.getPointAtLength(i);
    const hX = point.x - 300;
    const hY = -point.y + 276;
    
    const angle = Math.random() * Math.PI * 2;
    const radius = Math.random() * 400 + 100;
    const initialX = Math.cos(angle) * radius;
    const initialY = Math.sin(angle) * radius;
    const initialZ = (Math.random() - 0.5) * 300;

    const currentPos = new THREE.Vector3(initialX, initialY, initialZ);
    vertices.push(currentPos);
    
    heartTargets.push(new THREE.Vector3(
      hX + (Math.random() - 0.5) * 20,
      hY + (Math.random() - 0.5) * 20,
      (Math.random() - 0.5) * 40
    ));

    particlesData.push({
      current: currentPos,
      target: currentPos.clone(), 
      velocity: new THREE.Vector3(),
      randomSpeed: Math.random() * 0.05 + 0.02
    });
  }

  const totalParticles = vertices.length;
  
  const nichTargets = getTextCoordinates("Nich", totalParticles, window.innerWidth < 600 ? 320 : 340);
  const mehDombonTargets = getTextCoordinates("Meh Dombon", totalParticles, window.innerWidth < 600 ? 200 : 220);

  const geometry = new THREE.BufferGeometry().setFromPoints(vertices);
  const material = new THREE.PointsMaterial({
    color: 0xff3b6f,
    blending: THREE.AdditiveBlending,
    size: window.innerWidth < 600 ? 4.5 : 3.5,
    transparent: true,
    opacity: 0.85
  });
  const particles = new THREE.Points(geometry, material);
  scene.add(particles);

  /* TIME & ANIMATION STEP CONTROLS */
  let step = 0;
  let clock = new THREE.Clock();

  function render() {
    requestAnimationFrame(render);
    const time = clock.getElapsedTime();
    
    bgStarParticles.rotation.y = time * 0.02;
    bgStarParticles.rotation.x = Math.sin(time * 0.05) * 0.05;
    bgStarMaterial.opacity = 0.3 + Math.sin(time * 2) * 0.1;

    const vector = new THREE.Vector3(mouse.x, mouse.y, 0.5).unproject(camera);
    const dir = vector.sub(camera.position).normalize();
    const distance = -camera.position.z / dir.z;
    const posMouse3D = camera.position.clone().add(dir.multiplyScalar(distance));

    for (let i = 0; i < totalParticles; i++) {
      const p = particlesData[i];
      let baseTarget = p.target.clone();

      if (step === 1) {
        let pulseFactor = 1.0;
        let runningTime = (time * 2.5) % Math.PI;
        if (runningTime < 0.3) pulseFactor = 1.12;
        else if (runningTime > 0.4 && runningTime < 0.7) pulseFactor = 1.07;
        
        baseTarget.multiplyScalar(pulseFactor);
      }

      if (step >= 2) {
        baseTarget.y += Math.sin(time * 3 + baseTarget.x * 0.01) * 10;
        baseTarget.x += Math.cos(time * 2 + baseTarget.y * 0.01) * 4;
      }

      const distMouse = posMouse3D.distanceTo(p.current);
      let touchRadius = window.innerWidth < 600 ? 120 : 90;
      if (distMouse < touchRadius) {
        const force = (touchRadius - distMouse) / touchRadius;
        const pushDir = new THREE.Vector3().subVectors(p.current, posMouse3D).normalize();
        baseTarget.add(pushDir.multiplyScalar(force * 55));
      }

      p.velocity.x += (baseTarget.x - p.current.x) * p.randomSpeed;
      p.velocity.y += (baseTarget.y - p.current.y) * p.randomSpeed;
      p.velocity.z += (baseTarget.z - p.current.z) * p.randomSpeed;
      p.velocity.multiplyScalar(0.82);

      p.current.add(p.velocity);
      vertices[i].copy(p.current);
    }

    if(step === 0) {
      scene.rotation.z = time * 0.04; 
    } else {
      scene.rotation.z *= 0.95; 
      scene.rotation.y = Math.sin(time * 0.6) * 0.15;
      scene.rotation.x = Math.cos(time * 0.4) * 0.08;
    }

    geometry.setFromPoints(vertices);
    renderer.render(scene, camera);
  }

  /* STEP TRIGGER TRANSITION ENGINE */
  window.addEventListener('click', () => {
    const prompt = document.getElementById("click-prompt");

    if (step === 0) {
      // Phase 1: Vortex -> Heart Shape
      step = 1;
      gsap.to(prompt, { opacity: 0, duration: 0.3, onComplete: () => {
        prompt.innerText = "Click to read more";
        prompt.classList.add("at-bottom");
        gsap.to(prompt, { opacity: 1, duration: 0.3 });
      }});

      // SMOOTHED TRANSITION: Slower travel time and ultra-smooth ease-out decay curve
      particlesData.forEach((p, index) => {
        gsap.to(p.target, {
          x: heartTargets[index].x,
          y: heartTargets[index].y,
          z: heartTargets[index].z,
          duration: Math.random() * 2.0 + 2.5, // Increased duration up to 4.5s
          ease: "power4.out",                  // Elegant, buttery soft deceleration curve
          delay: Math.random() * 0.2
        });
      });

    } else if (step === 1) {
      // Phase 2: Heart Shape -> "NICH"
      step = 2;
      gsap.to(prompt, { opacity: 0, duration: 0.3, onComplete: () => {
        prompt.innerText = "Next Message";
        gsap.to(prompt, { opacity: 1, duration: 0.3 });
      }});

      particlesData.forEach((p, index) => {
        gsap.to(p.target, {
          x: nichTargets[index].x,
          y: nichTargets[index].y,
          z: nichTargets[index].z,
          duration: Math.random() * 2.0 + 1.5,
          ease: "power4.inOut",
          delay: Math.abs(p.target.x) * 0.002
        });
      });
      
      gsap.to(material.color, { r: 1.0, g: 0.25, b: 0.8, duration: 2.0 });

    } else if (step === 2) {
      // Phase 3: "NICH" -> "Meh Dombon"
      step = 3;
      gsap.to(prompt, { opacity: 0, duration: 0.3, onComplete: () => {
        document.getElementById("click-prompt").style.display = "none";
      }});

      particlesData.forEach((p, index) => {
        gsap.to(p.target, {
          x: mehDombonTargets[index].x,
          y: mehDombonTargets[index].y,
          z: mehDombonTargets[index].z,
          duration: Math.random() * 2.0 + 1.5,
          ease: "power4.inOut",
          delay: Math.random() * 0.4
        });
      });

      gsap.to(material.color, { r: 0.7, g: 0.3, b: 1.0, duration: 2.0 });
    }
  });

  /* ADAPTIVE WIN RESIZE SETUP */
  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    adjustCameraDistance(); 
    renderer.setSize(window.innerWidth, window.innerHeight);
  }
  window.addEventListener("resize", onWindowResize, false);

  onWindowResize();
  requestAnimationFrame(render);
</script>

</body>
</html>
